services:
  postgres:
    image: postgres:18
    container_name: devias-postgres
    environment:
      POSTGRES_USER: devias
      POSTGRES_PASSWORD: devias
      POSTGRES_DB: devias
    ports:
      - "5433:5432"
    volumes:
      - devias-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devias -d devias"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  devias-postgres:
