packages:
  - "packages/*"
  - "apps/*"
  - "modules/*"

# One version of every shared dependency, referenced as "catalog:" in package manifests.
catalog:
  # language + tooling
  typescript: ^5.9.3
  "@types/node": ^24.13.6
  "@biomejs/biome": ^2.5.14
  vitest: ^4.1.11
  tsx: ^4.23.15
  vite: ^7.3.6
  "@vitejs/plugin-react": ^5.2.0
  jsdom: ^30.1.0
  "@testing-library/react": ^16.3.3

  playwright-core: ^1.63.0

  # react + ui
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  tw-animate-css: ^1.4.0
  "@base-ui/react": ^1.8.0
  "@tabler/icons-react": ^3.49.0
  shadcn: ^4.21.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  cmdk: ^1.1.1
  date-fns: ^4.4.0
  zustand: ^5.0.15
  "@fontsource-variable/inter": ^5.2.8
  "@fontsource-variable/geist-mono": ^5.3.0
  "@fontsource/poppins": ^5.3.0
  "@react-pdf/renderer": ^4.5.0
  "@dnd-kit/core": ^6.3.1
  "@dnd-kit/sortable": ^10.0.0
  "@dnd-kit/utilities": ^3.2.2
  "@tanstack/react-router": ^1.170.38
  "@tanstack/react-query": ^5.103.2
  "@tanstack/react-table": ^8.21.3
  "@tanstack/react-virtual": ^3.14.13
  react-hook-form: ^7.88.0
  "@hookform/resolvers": ^5.9.1

  sonner: ^2.0.8

  react-resizable-panels: ^4.13.1
  react-grid-layout: 2.2.2
  "@xyflow/react": ^12.10.0

  react-day-picker: ^10.0.1

  # rich text (documents module)
  "@tiptap/react": ^3.31.3
  "@tiptap/pm": ^3.31.3
  "@tiptap/starter-kit": ^3.31.3
  "@tiptap/extension-mention": ^3.31.3
  "@tiptap/extension-list": ^3.31.3
  "@tiptap/extension-table": 3.31.3
  "@tiptap/extensions": ^3.31.3
  "@tiptap/suggestion": ^3.31.3

  # shared
  zod: ^4.6.5
  uuid: ^14.0.2
  eventsource-parser: ^4.1.1

  # ai
  "@anthropic-ai/sdk": ^0.128.0
  ai: ^7.0.143
  "@ai-sdk/google": ^4.0.99
  "@ai-sdk/openai": ^4.0.96
  react-markdown: ^10.1.0
  remark-gfm: ^4.0.1

  # server
  hono: ^4.13.8
  "@hono/zod-openapi": ^1.6.3
  "@hono/node-server": ^2.1.1
  better-auth: ^1.7.5
  "@better-auth/drizzle-adapter": ^1.7.5
  "@better-auth/api-key": ^1.7.5
  drizzle-orm: ^0.45.3
  drizzle-kit: ^0.31.11
  "@electric-sql/pglite": ^0.5.8
  pg: ^8.23.0
