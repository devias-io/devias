  sharp: ^0.35.5
  "@types/pg": ^8.23.1
  openapi-typescript: ^7.13.0
  openapi-fetch: ^0.17.0

  # cli
  commander: ^15.0.0
  picocolors: ^1.1.1
  chokidar: ^5.0.0

onlyBuiltDependencies:
  - esbuild
  - "@tailwindcss/oxide"
  - "@biomejs/biome"

# @better-auth/api-key still peers on utils 0.4.2; one version keeps a single @better-auth/core instance.
overrides:
  "@better-auth/utils": ^0.5.0
